<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seed Seed's outfit change</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  /* ===== 网页背景图设置 ===== */
  background: url("img/bg.jpg") no-repeat center center;
  background-size: cover;
  background-attachment: fixed;
  padding:24px;
  font-family:system-ui;
}
h1{
  text-align:center;
  margin-bottom:20px;
  color:#333;
}
.control-panel{
  max-width:900px;
  margin:0 auto 24px;
  background:#fff;
  padding:18px;
  border-radius:12px;
}
.category-item{
  margin-bottom:14px;
}
.category-title{
  font-size:16px;
  font-weight:bold;
  padding:6px 0;
  cursor:pointer;
  color:#444;
  user-select:none;
}
.category-content{
  padding-left:12px;
}
.check-item{
  display:inline-block;
  margin:6px 12px 6px 0;
  cursor:pointer;
  user-select:none;
}
.check-item input{
  margin-right:5px;
}
.btn-group{
  margin-top:16px;
  padding-top:12px;
  border-top:1px solid #eee;
}
.btn-group button{
  padding:6px 14px;
  border:none;
  border-radius:6px;
  background:#666;
  color:#fff;
  cursor:pointer;
}
.btn-group button:hover{
  background:#444;
}
.img-wrap{
  position:relative;
  max-width:900px;
  margin:0 auto;
  border-radius:10px;
  overflow:hidden;
  /* 预览区域背景，纯白，盖住网页背景 */
  background:#ffffff;
  min-height:100px;
}
.img-wrap img{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:auto;
  opacity:0;
  transition:opacity 0.3s ease;
  pointer-events:none;
}
.img-wrap img.show{
  opacity:1;
}
</style>
</head>
<body>
<h1>❤️Seed's outfit change❤️</h1>

<div class="control-panel" id="panelBox">
  <div id="categoryList"></div>
  <div class="btn-group">
    <button id="clearAll">清空所有</button>
  </div>
</div>

<div class="img-wrap" id="imgBox"></div>

<script>
// =========【在这里配置分类和图片】=========
const categoryList = [
  {
       catName: "背景",
    layers: [
      {src:"img/26.png", name:"阴影"},
    ]
  },
  {
     catName: "表情",
    layers: [
      {src:"xxx.github.io/Y.F./img/1.png", name:"表情1"},
      {src:"xxx.github.io/Y.F./img/2.png", name:"表情2"},
      {src:"xxx.github.io/Y.F./img/3.png", name:"表情3"},
      {src:"xxx.github.io/Y.F./img/4.png", name:"表情4"},
    ]
  },
  {
    catName: "丝袜",
    layers: [
      {src:"img/5.png", name:"白色丝袜"},
      {src:"img/6.png", name:"黑色丝袜"},
    ]
  },
  {
    catName: "渔网",
    layers: [
      {src:"img/7.png", name:"白渔网"},
      {src:"img/8.png", name:"黑渔网"},
    ]
  },
  {
    catName: "衣服",
    layers: [
      {src:"img/9.png", name:"奶牛衣服"},
      {src:"img/10.png", name:"兔女郎衣服"},
      {src:"img/11.png", name:"兔女郎毛球"},
    ]
  },
  {
    catName: "帽子、鞋",
    layers: [
      {src:"img/12.png", name:"奶牛头饰"},
      {src:"img/13.png", name:"兔女郎鞋"},
    ]
  },
  {
    catName: "装饰",
    layers: [
      {src:"img/14.png", name:"黑丝雾气"},
      {src:"img/15.png", name:"白丝雾气"},
      {src:"img/16.png", name:"白色激动"},
      {src:"img/17.png", name:"黑色激动"},
      {src:"img/18.png", name:"汗珠无脚"},
      {src:"img/19.png", name:"肉色激动"},
      {src:"img/20.png", name:"汗珠"},
      {src:"img/21.png", name:"爱心"},
 
    ]
  },
  {
    catName: "五官",
    layers: [
      {src:"img/22.png", name:"爱心眼1"},
      {src:"img/23.png", name:"爱心眼2"},
      {src:"img/24.png", name:"伸舌头"},
      {src:"img/25.png", name:"嘴型1"},
    ]
  }
];
// =========================================

const imgBox = document.getElementById('imgBox');
const categoryListDom = document.getElementById('categoryList');
const clearAllBtn = document.getElementById('clearAll');

function init(){
  categoryListDom.innerHTML = '';
  imgBox.innerHTML = '';

  categoryList.forEach((cat)=>{
    const catWrap = document.createElement('div');
    catWrap.className = 'category-item';

    const title = document.createElement('div');
    title.className = 'category-title';
    title.innerText = '▸ ' + cat.catName;
    const contentWrap = document.createElement('div');
    contentWrap.className = 'category-content';

    cat.layers.forEach(layer=>{
      const label = document.createElement('label');
      label.className = 'check-item';
      label.innerHTML = `<input type="checkbox" data-src="${layer.src}"> ${layer.name}`;
      label.querySelector('input').onchange = refreshView;
      contentWrap.appendChild(label);

      const img = document.createElement('img');
      img.src = layer.src;
      img.dataset.src = layer.src;
      img.onload = function(){
        imgBox.style.height = this.offsetHeight + "px";
      }
      imgBox.appendChild(img);
    })

    title.onclick = ()=>{
      if(contentWrap.style.display === 'none'){
        contentWrap.style.display = 'block';
        title.innerText = '▸ ' + cat.catName;
      }else{
        contentWrap.style.display = 'none';
        title.innerText = '▾ ' + cat.catName;
      }
    }
    catWrap.appendChild(title);
    catWrap.appendChild(contentWrap);
    categoryListDom.appendChild(catWrap);
  })
  refreshView();
}

function refreshView(){
  const selectedSrcList = [];
  document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb=>{
    selectedSrcList.push(cb.dataset.src);
  })
  document.querySelectorAll('#imgBox img').forEach(img=>{
    if(selectedSrcList.includes(img.dataset.src)){
      img.classList.add('show');
    }else{
      img.classList.remove('show');
    }
  })
}

clearAllBtn.onclick = ()=>{
  document.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
    cb.checked = false;
  })
  refreshView();
}

init();
</script>
</body>
</html>
